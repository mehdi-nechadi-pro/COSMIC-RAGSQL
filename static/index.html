<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AstroChat</title>
    <script src="/static/js_virtualsky/jquery.min.js"></script>
    <script src="/static/js_virtualsky/app.js"></script>
    <script src="/static/js_virtualsky/virtualsky.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <div id="sidebar">
        <div class="app-header">
            <a href="#" class="logo-container">
                <span class="logo-icon">🪐</span> 
            </a>
            <div class="app-info">
                <h2>AstroChat</h2>
                <p>Assistant d'observation</p>
            </div>
        </div>

        <div id="chat-history">
            <div class="msg bot">
                Bonjour ! Je suis ton assistant astronome. 🔭<br>
                Pose-moi des questions générales sur l'astronomie ou sur la visibilité d'un objet céleste !!
            </div>
        </div>

        <div id="input-area">
            <div class="input-wrapper">
                <input type="text" id="userMsg" placeholder="Pose ta question..." onkeydown="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="map-container">
        
        <div id="map-overlay">
            <div class="overlay-content">
                <h2>AstroChat</h2>
                <p>En attente d'observation...</p>
            </div>
        </div>

        <div id="starmap"></div>

        <div id="detailsPanel" style="display:none;">
            <div id="detailsContent"></div>
        </div>

        <div id="pollution-controls">
            <span class="label-vue">Vue :</span>
            <button onclick="changeView('city', this)" class="btn-astro">🏙️ Ville</button>
            <button onclick="changeView('hybrid', this)" class="btn-astro active">🏡 Standard</button>
            <button onclick="changeView('dark', this)" class="btn-astro">✨ Plein Ciel</button>
            <button id="btn-constellation" onclick="toggleConstellation(this)" class="btn-astro active"> ♈ Constellations </button>
        </div>

        <div id="informations-box">
            <span id="city-display">City : </span>
            <span id="local-time-display">Local Time : </span>
            <span id="latitude-longitude-display">Lat/Lon : </span>
        </div>

        <button id="toggleMapBtn" onclick="toggleFullscreen()">⤢</button>

    </div>

</body>

</html>
